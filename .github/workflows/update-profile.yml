name: Refresh profile cards

on:
  schedule:
    - cron: "23 9 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - README.md
      - .github/workflows/update-profile.yml
      - scripts/yearly_languages.py
      - scripts/update_stats.py
      - scripts/build_profile_layout.py

permissions:
  contents: write

concurrency:
  group: profile-cards
  cancel-in-progress: false

jobs:
  refresh:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Restore public source history
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ runner.temp }}/profile-history
          key: profile-history-v1-${{ github.run_id }}
          restore-keys: profile-history-v1-

      - name: Refresh original stats card and lifetime PR activity
        run: python3 scripts/update_stats.py
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate all-time languages and career LOC totals
        run: |
          if [ -n "$PRIVATE_STATS_TOKEN" ]; then
            python3 scripts/yearly_languages.py --cache-dir "$PROFILE_HISTORY_CACHE" --include-private
          else
            python3 scripts/yearly_languages.py --cache-dir "$PROFILE_HISTORY_CACHE" --preserve-private
          fi
        env:
          # One read-only token per repository owner, one token per line.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PRIVATE_STATS_TOKEN: ${{ secrets.PROFILE_STATS_TOKEN }}
          PROFILE_HISTORY_CACHE: ${{ runner.temp }}/profile-history

      - name: Align the skyline with the stacked stats and languages
        run: python3 scripts/build_profile_layout.py

      - name: Commit refreshed cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/github-stats.svg assets/top-languages.svg assets/profile-summary.svg assets/profile-skyline.svg
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Refresh profile cards"
          git push origin HEAD:main
