name: Refresh profile cards

on:
  schedule:
    - cron: "23 9 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - README.md
      - .github/workflows/update-profile.yml
      - scripts/yearly_languages.py
      - scripts/update_stats.py

permissions:
  contents: write

concurrency:
  group: profile-cards
  cancel-in-progress: false

jobs:
  refresh:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Refresh original stats card and lifetime PR activity
        run: python3 scripts/update_stats.py
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate languages from the last year of authored changes
        run: python3 scripts/yearly_languages.py
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit refreshed cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/github-stats.svg assets/top-languages.svg
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Refresh profile cards"
          git push origin HEAD:main
